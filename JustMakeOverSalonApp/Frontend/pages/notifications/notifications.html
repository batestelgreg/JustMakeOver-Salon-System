<!-- Kani nga notifications page kay para sa mga notification sa current user
     (unread una) nga gihimo sa issuance/receiving engine per Figure 8. -->
<div class="notifications-page">
    <div class="page-header">
        <div>
            <h2 class="page-header__title">Notifications</h2>
            <p class="page-header__subtitle">Alerts and updates about your requests and stock activity.</p>
        </div>
        <div class="u-flex--gap">
            <button type="button" class="btn btn--ghost" id="btnRefreshNotifications">Refresh</button>
            <button type="button" class="btn btn--secondary" id="btnMarkAllRead">Mark all as read</button>
        </div>
    </div>

    <!-- Kani nga card kay para sa notification list (unread highlighted). -->
    <div class="card">
        <div class="data-table">
            <table id="notificationsTable">
                <thead>
                    <tr>
                        <th>Notification</th>
                        <th>Type</th>
                        <th>Received</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="notificationsTableBody">
                    <tr><td colspan="5" class="data-table__empty">Loading notifications&hellip;</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
