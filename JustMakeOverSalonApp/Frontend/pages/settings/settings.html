<!-- Kani nga settings page kay para sa system settings: categories master list. -->
<div class="settings-page">
    <div class="page-header">
        <div>
            <h2 class="page-header__title">Settings</h2>
            <p class="page-header__subtitle">Manage master lists used across the system.</p>
        </div>
    </div>

    <!-- Kani nga card kay para sa category management sa Inventory master data. -->
    <div class="card">
        <div class="u-flex--between u-mb-4">
            <h3 style="font-size: 17px;">Categories</h3>
            <button type="button" class="btn btn--primary" id="btnOpenAddCategory" data-requires="settings.manage">+ New Category</button>
        </div>
        <div class="data-table">
            <table id="categoriesTable">
                <thead>
                    <tr>
                        <th>Category</th>
                        <th>Items</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="categoriesTableBody">
                    <tr><td colspan="4" class="data-table__empty">Loading categories&hellip;</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Kani nga card kay para sa unit of measures master list
         (gamiton sa inventory item form dropdown). -->
    <div class="card">
        <div class="u-flex--between u-mb-4">
            <h3 style="font-size: 17px;">Unit of Measures</h3>
            <button type="button" class="btn btn--primary" id="btnOpenAddUom" data-requires="settings.manage">+ New Unit</button>
        </div>
        <div class="data-table">
            <table id="uomsTable">
                <thead>
                    <tr>
                        <th>Unit</th>
                        <th>Items</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="uomsTableBody">
                    <tr><td colspan="4" class="data-table__empty">Loading units&hellip;</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Kani nga card kay para sa system preferences (branding ug
         default restock days sa shortage notification). -->
    <div class="card">
        <h3 class="u-mb-4" style="font-size: 17px;">Preferences</h3>
        <form id="preferencesForm" novalidate>
            <div class="settings-grid">
                <div class="form-field">
                    <label class="form-field__label" for="txtSalonName">Salon name (sidebar)</label>
                    <input type="text" id="txtSalonName" class="form-field__input" maxlength="100" autocomplete="off">
                    <span class="form-field__error" id="errorSalonName"></span>
                </div>
                <div class="form-field">
                    <label class="form-field__label" for="txtSalonTagline">Salon tagline (sidebar)</label>
                    <input type="text" id="txtSalonTagline" class="form-field__input" maxlength="60" autocomplete="off">
                    <span class="form-field__error" id="errorSalonTagline"></span>
                </div>
                <div class="form-field">
                    <label class="form-field__label" for="numRestockDays">Default restock days (shortage notices)</label>
                    <input type="number" id="numRestockDays" class="form-field__input" min="1" max="365" autocomplete="off">
                    <span class="form-field__error" id="errorRestockDays"></span>
                </div>
            </div>
            <button type="submit" class="btn btn--primary" id="btnSavePreferences" data-requires="settings.manage">Save Preferences</button>
        </form>
    </div>

    <!-- Kani nga modal kay para sa paghimo ug pag-edit sa category. -->
    <div id="categoryModal" class="modal-overlay u-hidden">
        <div class="modal">
            <div class="modal__header">
                <h3 class="modal__title" id="categoryModalTitle">New Category</h3>
                <button type="button" class="modal__close" id="btnCloseCategoryModal" aria-label="Close">&times;</button>
            </div>
            <form id="categoryForm" novalidate>
                <div class="modal__body">
                    <input type="hidden" id="editCategoryID" value="">
                    <div class="form-field">
                        <label class="form-field__label" for="txtCategoryName">Category name</label>
                        <input type="text" id="txtCategoryName" class="form-field__input" maxlength="100" autocomplete="off">
                        <span class="form-field__error" id="errorCategoryName"></span>
                    </div>
                    <div class="form-field u-hidden" id="fieldCategoryActive">
                        <label class="form-field__label u-flex--gap">
                            <input type="checkbox" id="chkCategoryActive" checked> Category is active
                        </label>
                    </div>
                </div>
                <div class="modal__footer">
                    <button type="button" class="btn btn--ghost" id="btnCancelCategory">Cancel</button>
                    <button type="submit" class="btn btn--primary" id="btnSaveCategory">Save Category</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Kani nga modal kay para sa paghimo ug pag-edit sa unit of measure. -->
    <div id="uomModal" class="modal-overlay u-hidden">
        <div class="modal">
            <div class="modal__header">
                <h3 class="modal__title" id="uomModalTitle">New Unit of Measure</h3>
                <button type="button" class="modal__close" id="btnCloseUomModal" aria-label="Close">&times;</button>
            </div>
            <form id="uomForm" novalidate>
                <div class="modal__body">
                    <input type="hidden" id="editUomID" value="">
                    <div class="form-field">
                        <label class="form-field__label" for="txtUomName">Unit name (e.g. bottle, tube)</label>
                        <input type="text" id="txtUomName" class="form-field__input" maxlength="20" autocomplete="off">
                        <span class="form-field__error" id="errorUomName"></span>
                    </div>
                    <div class="form-field u-hidden" id="fieldUomActive">
                        <label class="form-field__label u-flex--gap">
                            <input type="checkbox" id="chkUomActive" checked> Unit is active
                        </label>
                    </div>
                </div>
                <div class="modal__footer">
                    <button type="button" class="btn btn--ghost" id="btnCancelUom">Cancel</button>
                    <button type="submit" class="btn btn--primary" id="btnSaveUom">Save Unit</button>
                </div>
            </form>
        </div>
    </div>
</div>
