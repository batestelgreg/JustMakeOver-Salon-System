<!-- Kani nga settings page kay para sa system settings: categories master list. -->
<div class="settings-page">
    <div class="page-header">
        <div>
            <h2 class="page-header__title">Settings</h2>
            <p class="page-header__subtitle">Manage master lists used across the system.</p>
        </div>
    </div>

    <!-- Kani nga card kay para sa category management sa Inventory master data. -->
    <div class="card">
        <div class="u-flex--between u-mb-4">
            <h3 style="font-size: 17px;">Categories</h3>
            <button type="button" class="btn btn--primary" id="btnOpenAddCategory">+ New Category</button>
        </div>
        <div class="data-table">
            <table id="categoriesTable">
                <thead>
                    <tr>
                        <th>Category</th>
                        <th>Items</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="categoriesTableBody">
                    <tr><td colspan="4" class="data-table__empty">Loading categories&hellip;</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Kani nga modal kay para sa paghimo ug pag-edit sa category. -->
    <div id="categoryModal" class="modal-overlay u-hidden">
        <div class="modal">
            <div class="modal__header">
                <h3 class="modal__title" id="categoryModalTitle">New Category</h3>
                <button type="button" class="modal__close" id="btnCloseCategoryModal" aria-label="Close">&times;</button>
            </div>
            <form id="categoryForm" novalidate>
                <div class="modal__body">
                    <input type="hidden" id="editCategoryID" value="">
                    <div class="form-field">
                        <label class="form-field__label" for="txtCategoryName">Category name</label>
                        <input type="text" id="txtCategoryName" class="form-field__input" maxlength="100" autocomplete="off">
                        <span class="form-field__error" id="errorCategoryName"></span>
                    </div>
                    <div class="form-field u-hidden" id="fieldCategoryActive">
                        <label class="form-field__label u-flex--gap">
                            <input type="checkbox" id="chkCategoryActive" checked> Category is active
                        </label>
                    </div>
                </div>
                <div class="modal__footer">
                    <button type="button" class="btn btn--ghost" id="btnCancelCategory">Cancel</button>
                    <button type="submit" class="btn btn--primary" id="btnSaveCategory">Save Category</button>
                </div>
            </form>
        </div>
    </div>
</div>
