<!-- Kani nga suppliers page kay para sa supplier master list
     (source sa quotations ug POs sa Purchasing phase sa Figure 6). -->
<div class="suppliers-page">
    <div class="page-header">
        <div>
            <h2 class="page-header__title">Suppliers</h2>
            <p class="page-header__subtitle">Manage the supplier master list used by purchasing.</p>
        </div>
        <button type="button" class="btn btn--primary" id="btnOpenAddSupplier" data-requires="suppliers.manage">+ New Supplier</button>
    </div>

    <!-- Kani nga card kay para sa suppliers master list table. -->
    <div class="card">
        <div class="data-table">
            <table id="suppliersTable">
                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Supplier</th>
                        <th>Contact person</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Quotations</th>
                        <th>POs</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="suppliersTableBody">
                    <tr><td colspan="9" class="data-table__empty">Loading suppliers&hellip;</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Kani nga modal kay para sa paghimo ug pag-edit sa supplier. -->
    <div id="supplierModal" class="modal-overlay u-hidden">
        <div class="modal">
            <div class="modal__header">
                <h3 class="modal__title" id="supplierModalTitle">New Supplier</h3>
                <button type="button" class="modal__close" id="btnCloseSupplierModal" aria-label="Close">&times;</button>
            </div>
            <form id="supplierForm" novalidate>
                <div class="modal__body">
                    <input type="hidden" id="editSupplierID" value="">
                    <div class="form-field">
                        <label class="form-field__label" for="txtSupplierName">Supplier name</label>
                        <input type="text" id="txtSupplierName" class="form-field__input" maxlength="200" autocomplete="off">
                        <span class="form-field__error" id="errorSupplierName"></span>
                    </div>
                    <div class="suppliers-grid">
                        <div class="form-field">
                            <label class="form-field__label" for="txtContactFirst">Contact first name</label>
                            <input type="text" id="txtContactFirst" class="form-field__input" maxlength="100" autocomplete="off">
                            <span class="form-field__error" id="errorContactFirst"></span>
                        </div>
                        <div class="form-field">
                            <label class="form-field__label" for="txtContactMiddle">Contact middle name (optional)</label>
                            <input type="text" id="txtContactMiddle" class="form-field__input" maxlength="100" autocomplete="off">
                        </div>
                        <div class="form-field">
                            <label class="form-field__label" for="txtContactLast">Contact last name</label>
                            <input type="text" id="txtContactLast" class="form-field__input" maxlength="100" autocomplete="off">
                            <span class="form-field__error" id="errorContactLast"></span>
                        </div>
                    </div>
                    <div class="suppliers-grid">
                        <div class="form-field">
                            <label class="form-field__label" for="txtSupplierPhone">Phone</label>
                            <input type="text" id="txtSupplierPhone" class="form-field__input" maxlength="20" autocomplete="off">
                            <span class="form-field__error" id="errorSupplierPhone"></span>
                        </div>
                        <div class="form-field">
                            <label class="form-field__label" for="txtSupplierEmail">Email (optional)</label>
                            <input type="email" id="txtSupplierEmail" class="form-field__input" maxlength="508" autocomplete="off">
                            <span class="form-field__error" id="errorSupplierEmail"></span>
                        </div>
                    </div>
                    <div class="form-field">
                        <label class="form-field__label" for="txtSupplierAddress">Address (optional)</label>
                        <input type="text" id="txtSupplierAddress" class="form-field__input" maxlength="1000" autocomplete="off">
                    </div>
                    <div class="form-field u-hidden" id="fieldSupplierActive">
                        <label class="form-field__label u-flex--gap">
                            <input type="checkbox" id="chkSupplierActive" checked> Supplier is active
                        </label>
                    </div>
                </div>
                <div class="modal__footer">
                    <button type="button" class="btn btn--ghost" id="btnCancelSupplier">Cancel</button>
                    <button type="submit" class="btn btn--primary" id="btnSaveSupplier">Save Supplier</button>
                </div>
            </form>
        </div>
    </div>
</div>
