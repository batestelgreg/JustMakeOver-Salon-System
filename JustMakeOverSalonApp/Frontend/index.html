<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Just MakeOver Salon System</title>

    <!-- Kani nga shared styles kay gi-load sa tanang pages sa app shell. -->
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/reset.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/utilities.css">

    <!-- Kani nga icon kay para walay external request sa window icon. -->
    <link rel="icon" href="/images/logo.png">

    <!-- Kani nga main module kay entry point sa tanang frontend logic. -->
    <script type="module" src="/assets/js/core/app.js"></script>
</head>
<body>
    <!-- Kani nga auth view kay para sa login ug related screens. -->
    <div id="authView"></div>

    <!-- Kani nga app shell kay para sa authenticated workspace. -->
    <div id="appShell" class="app-shell u-hidden">
        <aside class="sidebar">
            <div class="sidebar__brand">
                <img src="/images/logo.png" alt="Just MakeOver Salon logo" class="sidebar__logo">
                <div>
                    <div class="sidebar__brand-name">Just MakeOver</div>
                    <div class="sidebar__brand-tag">Beauty Salon &amp; Spa</div>
                </div>
            </div>
            <nav class="sidebar__nav" id="sidebarNav" aria-label="Main navigation"></nav>
            <div class="sidebar__footer">
                Just MakeOver Salon System
            </div>
        </aside>

        <div class="app-main">
            <header class="topbar">
                <div>
                    <h1 class="topbar__title" id="pageTitle">Loading&hellip;</h1>
                    <p class="u-text-muted" id="pageSubtitle" style="font-size: 12px;"></p>
                </div>
                <div class="topbar__actions">
                    <button type="button" class="topbar__bell" id="notificationBell"
                            aria-label="Notifications" title="Notifications">
                        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                            <path fill="currentColor" d="M12 22a2 2 0 002-2h-4a2 2 0 002 2zm6-6V11a6 6 0 00-5-5.9V4a1 1 0 10-2 0v1.1A6 6 0 006 11v5l-2 2v1h16v-1l-2-2z"/>
                        </svg>
                    </button>
                    <div class="user-chip">
                        <div class="user-chip__avatar" id="userAvatar"></div>
                        <div>
                            <div class="user-chip__name" id="userName"></div>
                            <div class="user-chip__role" id="userRole"></div>
                        </div>
                    </div>
                    <button type="button" class="btn btn--ghost" id="signOutButton">
                        Sign out
                    </button>
                </div>
            </header>

            <main class="page-content" id="pageContent">
                <div class="page__loading">
                    <div class="spinner" aria-hidden="true"></div>
                    Loading the salon workspace&hellip;
                </div>
            </main>
        </div>
    </div>
</body>
</html>
